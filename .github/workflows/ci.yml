name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: checks
        run: |
          node --version
          npm ci
          npm run typecheck
          npm test

  fail:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[fail]')
    steps:
      - name: intentional failure
        run: |
          echo "about to fail" >&2
          echo "error: intentional failure for opencode-ci-watch" >&2
          exit 1
